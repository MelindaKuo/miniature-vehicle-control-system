; PlatformIO project configuration
; Miniature EV control system: DIM (sensor node) + VCU (controller node)
; on one ESP32, talking over TWAI in self-test loopback mode.

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Every task/rate/priority constant lives in include/project_config.h,
    ; not here, so the build file stays boring.

; The real firmware never compiles src/bringup/ -- those files each define
; their own setup()/loop() and would collide with main.cpp's.
build_src_filter = +<*> -<bringup/>

; ---------------------------------------------------------------------------
; Step 2 bring-up environments. Each one is a standalone tiny program that
; exercises exactly one peripheral -- no task scheduler, no other node, just
; "does this wire work". `extends` pulls in platform/board/framework/monitor
; settings from [env:esp32dev]; build_src_filter is NOT merged, so each one
; restates itself from -<*> (exclude everything) and adds back only what it
; needs.
;
; Select one from the PlatformIO project-environment picker in the VSCode
; status bar, or: pio run -e bringup_twai -t upload -t monitor
; ---------------------------------------------------------------------------

[env:bringup_twai]
extends = env:esp32dev
build_src_filter = -<*> +<bringup/twai_test.cpp> +<can_bus.cpp>

[env:bringup_mpu6050]
extends = env:esp32dev
build_src_filter = -<*> +<bringup/mpu6050_test.cpp> +<mpu6050.cpp>

[env:bringup_pots]
extends = env:esp32dev
build_src_filter = -<*> +<bringup/pots_test.cpp>

[env:bringup_buttons]
extends = env:esp32dev
build_src_filter = -<*> +<bringup/buttons_test.cpp>

[env:bringup_pwm]
extends = env:esp32dev
build_src_filter = -<*> +<bringup/pwm_test.cpp>

; No external libs yet. The MPU6050 is driven with raw Wire register access
; in Step 2 on purpose -- reading WHO_AM_I and ACCEL_XOUT_H yourself is the
; whole point of the I2C exercise. If you later decide you would rather use a
; driver library, uncomment:
; lib_deps =
;     adafruit/Adafruit MPU6050
;     adafruit/Adafruit Unified Sensor
